<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیشنهاد همکاری استراتژیک | سینره × یکتانت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cinere-gold:#1f5c96;
    --cinere-gold-light:#6fa3d1;
    --cinere-green:#65bc7b;
    --cinere-navy:#0d244c;
    --cinere-charcoal:#212934;
    --cinere-cream:#f4f0f0;
    --yekta-yellow:#b7d1ea;
    --navy-line:#1c3f78;
    --ink:#232323;
    --muted:#6b7280;
    --line:#e6e2df;
    --white:#ffffff;
    --radius:14px;
    --nav-h:64px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Vazirmatn', Tahoma, Arial, sans-serif;
    background:var(--cinere-cream);
    color:var(--ink);
    line-height:1.9;
    font-size:15.5px;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit;}

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed; top:0; right:0; left:0; z-index:200;
    background:linear-gradient(90deg, var(--cinere-navy) 0%, #0a1c3c 100%);
    box-shadow:0 2px 14px rgba(0,0,0,.18);
    border-bottom:3px solid var(--navy-line);
  }
  #brandRow{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 22px; gap:14px;
  }
  .brand-lockup{
    display:flex; align-items:center; gap:9px;
    background:#fff; border-radius:10px; padding:6px 10px;
  }
  .brand-lockup img{height:20px; width:auto; object-fit:contain;}
  .brand-x{color:var(--cinere-navy); font-weight:700; font-size:11px; opacity:.55;}
  .brand-title{color:#fff; font-size:13px; font-weight:600;}
  .brand-title span{display:block; color:var(--yekta-yellow); font-size:10.5px; font-weight:500; margin-top:1px;}
  #credBtn{
    display:flex; align-items:center; gap:7px;
    background:rgba(183,209,234,.14); border:1px solid rgba(183,209,234,.45);
    color:var(--yekta-yellow); font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:999px; white-space:nowrap; cursor:pointer;
  }
  #credBtn:hover{background:rgba(183,209,234,.25);}

  nav#toc{
    display:flex; overflow-x:auto; gap:4px; padding:0 16px 10px;
    scrollbar-width:thin;
  }
  nav#toc::-webkit-scrollbar{height:5px;}
  nav#toc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:6px;}
  nav#toc button{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:9px; border:none; cursor:pointer;
    font-size:12.6px; color:rgba(255,255,255,.72); background:transparent;
    transition:all .15s ease; white-space:nowrap;
  }
  nav#toc button .num{
    flex:0 0 18px; height:18px; border-radius:50%;
    background:rgba(255,255,255,.1); color:rgba(255,255,255,.6);
    font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  nav#toc button:hover{background:rgba(255,255,255,.08); color:#fff;}
  nav#toc button.active{background:rgba(183,209,234,.15); color:#fff;}
  nav#toc button.active .num{background:var(--yekta-yellow); color:var(--cinere-navy);}

  /* ---------- Main ---------- */
  #main{max-width:980px; margin:0 auto; padding:calc(var(--nav-h) + 92px) 30px 70px;}
  @media (min-width:1000px){ #main{padding-left:46px; padding-right:46px;} }

  .page{display:none; animation:fadeIn .25s ease;}
  .page.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .kicker{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .kicker .idx{
    width:34px; height:34px; border-radius:10px;
    background:var(--cinere-navy); color:var(--yekta-yellow);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; flex:0 0 34px;
  }
  h2.sec-title{font-size:21px; font-weight:800; color:var(--cinere-navy); margin:0;}
  .sec-lead{color:var(--muted); font-size:14.5px; margin:2px 0 22px 44px; max-width:760px;}
  p{margin:0 0 14px;}
  h3.sub{font-size:16px; font-weight:700; color:var(--cinere-charcoal); margin:22px 0 10px;}
  ul.clean, ol.clean{margin:0 0 14px; padding-inline-start:20px;}
  ul.clean li, ol.clean li{margin-bottom:7px;}

  .callout{
    background:#fff; border:1px solid var(--line); border-inline-start:4px solid var(--cinere-gold);
    border-radius:10px; padding:16px 18px; margin:16px 0; font-size:14.3px; color:var(--cinere-charcoal);
  }
  .callout.green{border-inline-start-color:var(--cinere-green);}
  .callout.navy{border-inline-start-color:var(--cinere-navy); background:#f6f8fb;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:760px){.grid-2, .grid-3{grid-template-columns:1fr;}}

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
  .card h4{margin:0 0 8px; font-size:14.5px; color:var(--cinere-navy); font-weight:700;}
  .card p{font-size:13.6px; color:var(--muted); margin:0;}

  .stat-row{display:flex; flex-wrap:wrap; gap:14px; margin:18px 0 6px;}
  .stat-tile{flex:1 1 150px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-align:center;}
  .stat-tile .num{font-size:19px; font-weight:800; color:var(--cinere-navy);}
  .stat-tile .lbl{font-size:11.8px; color:var(--muted); margin-top:4px;}

  table{width:100%; border-collapse:collapse; margin:16px 0; font-size:13.4px;}
  thead th{background:var(--cinere-navy); color:#fff; text-align:right; padding:11px 12px; font-weight:600; font-size:12.6px;}
  thead th:first-child{border-radius:8px 0 0 0;}
  thead th:last-child{border-radius:0 8px 0 0;}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; background:#fff;}
  tbody tr:last-child td{border-bottom:none;}
  .prio{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; font-weight:800; font-size:12px; color:#fff;}
  .prio.A{background:var(--cinere-gold);}
  .prio.B{background:var(--cinere-green);}
  .prio.C{background:#9aa1ab;}

  .funnel{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:18px 0;}
  .funnel .step{background:var(--cinere-navy); color:#fff; font-size:12.5px; font-weight:600; padding:9px 15px; border-radius:8px; white-space:nowrap;}
  .funnel .arrow{color:var(--cinere-gold); font-size:16px;}

  .tl{position:relative; margin:22px 0 6px; padding-inline-start:26px; border-inline-start:2px solid var(--line);}
  .tl-item{position:relative; padding-bottom:24px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:''; position:absolute; right:-33px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--cinere-gold); border:3px solid #fff; box-shadow:0 0 0 2px var(--cinere-gold);}
  .tl-item .when{font-size:12px; color:var(--cinere-gold); font-weight:700; margin-bottom:3px;}
  .tl-item .what{font-size:14px; font-weight:700; color:var(--cinere-charcoal); margin-bottom:3px;}
  .tl-item .desc{font-size:13px; color:var(--muted);}

  .footer-note{margin-top:10px; padding:22px 0 10px; font-size:12px; color:var(--muted); text-align:center;}

  /* -------- Package selector -------- */
  .pkg-toggle{display:flex; gap:10px; margin:18px 0 22px;}
  .pkg-btn{
    flex:1; padding:16px 18px; border-radius:14px; border:2px solid var(--line); background:#fff;
    cursor:pointer; text-align:right; transition:all .15s ease;
  }
  .pkg-btn .pkg-name{font-size:15px; font-weight:800; color:var(--cinere-charcoal);}
  .pkg-btn .pkg-desc{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .pkg-btn.active{border-color:var(--cinere-gold); background:linear-gradient(160deg,#eef5fb,#fff);}
  .pkg-btn.active .pkg-name{color:var(--cinere-gold);}

  .media-picker{display:flex; flex-direction:column; gap:10px; margin:16px 0 22px;}
  .media-row{
    display:flex; align-items:flex-start; gap:14px; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; flex-wrap:wrap;
  }
  .media-row.locked{opacity:.55;}
  .media-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--cinere-gold); flex:0 0 18px; cursor:pointer; margin-top:3px;}
  .media-row .m-name{flex:1 1 240px; font-size:13.6px; font-weight:700; color:var(--cinere-charcoal);}
  .media-row .m-slider-row{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .media-row .m-tag{font-size:10.8px; padding:3px 9px; border-radius:999px; font-weight:700; flex:0 0 auto; margin-top:2px;}
  .m-tag.A{background:rgba(31,92,150,.14); color:#1c4a73;}
  .m-tag.B{background:rgba(101,188,123,.16); color:#2f7a45;}
  .m-tag.C{background:#eef0f2; color:#6b7280;}
  .media-row .m-price{flex:0 0 170px; font-size:11.5px; color:var(--muted); text-align:left; line-height:1.6;}
  .media-row .m-alloc{flex:0 0 auto; font-size:13px; font-weight:800; color:var(--cinere-navy); min-width:118px; text-align:left;}
  .media-row .m-vol{flex:0 0 140px; font-size:11.3px; color:var(--muted); text-align:left;}
  @media (max-width:820px){
    .media-row .m-price, .media-row .m-alloc, .media-row .m-vol{flex:1 1 100%; text-align:right;}
  }

  .budget-box{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin:6px 0 20px;}
  .budget-box label{font-size:13px; font-weight:700; color:var(--cinere-charcoal); display:block; margin-bottom:8px;}
  .budget-box input[type=number]{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:9px; font-size:15px;
    font-family:inherit; text-align:left; direction:ltr; margin-bottom:16px;
  }
  .slider-row{display:flex; align-items:center; gap:14px;}
  .slider-row input[type=range]{flex:1; accent-color:var(--cinere-gold); height:6px;}
  .slider-readout{
    min-width:110px; text-align:center; background:var(--cinere-navy); color:#fff;
    border-radius:9px; padding:8px 10px; font-weight:800; font-size:14px;
  }
  .slider-scale{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px;}
  .total-readout{
    display:flex; justify-content:space-between; align-items:center; margin-top:18px;
    background:var(--cinere-cream); border-radius:10px; padding:14px 18px;
  }
  .total-readout .lbl{font-size:12.5px; color:var(--muted);}
  .total-readout .val{font-size:19px; font-weight:800; color:var(--cinere-navy);}

  .export-btn{
    display:block; width:100%; margin:16px 0 0; padding:14px 18px; border:none; border-radius:12px;
    background:var(--cinere-navy); color:#fff; font-family:inherit; font-size:14.5px; font-weight:700;
    cursor:pointer; transition:background .15s ease;
  }
  .export-btn:hover{background:#123166;}

  .disclaimer-box{
    font-size:11.8px; color:var(--muted); background:#f6f8fb; border-radius:10px; padding:12px 16px; margin-top:14px;
    border:1px dashed var(--line);
  }

  @media print{ #topbar{display:none;} #main{margin:0; max-width:100%; padding-top:20px;} .page{display:block !important; page-break-after:always;} }
</style>
</head>
<body>

<div id="topbar">
  <div id="brandRow">
    <div class="brand-lockup">
      <img src="https://cinere.ir/wp-content/uploads/2024/04/Cinere-Logo-EN-3.png" alt="سینره">
      <span class="brand-x">×</span>
      <img src="https://www.yektanet.com/wp-content/uploads/2021/08/logo.png" alt="یکتانت">
    </div>
    <div class="brand-title">پیشنهاد همکاری استراتژیک — فاز اول<span>رشد فروش آنلاین و اتصال به مارکت‌پلیس</span></div>
    <a id="credBtn" href="./Credential-Yektanet-170204.pdf" download>
      ⬇ دانلود کردنشیال یکتانت (PDF)
    </a>
  </div>
  <nav id="toc"></nav>
</div>

<main id="main"></main>

<script>
/* ============================================================
   DATA — pricing & capability facts kept in one place so the
   proposal text and the interactive calculator never diverge.
   All figures below come from the Yektanet rate card provided
   for this engagement. Nothing here is invented.
   ============================================================ */
const MEDIA = [
  { id:'search',   name:'گوگل سرچ ادز (فرست‌ادز)',              tier:'A', unit:'CPC', min:null, max:null, note:'نیازمند استعلام (مزایده گوگل)', baseBudget:300000000, volType:'click', stage:'performance' },
  { id:'native',   name:'تبلیغات پویا / همسان (موضوعی-رفتاری)', tier:'A', unit:'CPC', min:1500, max:12000, note:'۱,۵۰۰ تا ۱۲,۰۰۰ تومان', baseBudget:500000000, volType:'click', stage:'performance' },
  { id:'retarget', name:'ریتارگتینگ (سبد رها‌شده + مشابه/مکمل)', tier:'A', unit:'CPC', min:4000, max:15000, note:'۴,۰۰۰ تا ۱۵,۰۰۰ تومان', baseBudget:200000000, volType:'click', stage:'performance' },
  { id:'product',  name:'تبلیغات محصول (ریتارگتینگ محصول)',     tier:'A', unit:'CPC', min:2000, max:10000, note:'۲,۰۰۰ تا ۱۰,۰۰۰ تومان', baseBudget:300000000, volType:'click', stage:'performance' },
  { id:'display',  name:'Google Display (مکمل همسان/بنری)',    tier:'B', unit:'CPC', min:null, max:null, note:'نیازمند استعلام', baseBudget:200000000, volType:'click', stage:'performance' },
  { id:'push',     name:'Push Notification',                    tier:'B', unit:'CPC', min:1600, max:1600, note:'~۱,۶۰۰ تومان', baseBudget:200000000, volType:'click', condition:'ارسال به کاربران Push در شبکه ناشران یکتانت (مستقل از دیتابیس سینره)', stage:'performance' },
  { id:'sms',      name:'پیامک (Retention/Activation)',         tier:'B', unit:'نفر', min:210, max:210, note:'~۲۱۰ تومان/نفر', baseBudget:200000000, volType:'reach', condition:'مشروط به کالیبراسیون با CRM سینره', stage:'performance' },
  { id:'socialext',name:'سوشال مدیا خارجی (اینستاگرام/یوتیوب)', tier:'C', unit:'—', min:null, max:null, note:'متغیر / نیازمند استعلام', baseBudget:1000000000, volType:'none', stage:'awareness' },
  { id:'socialint',name:'سوشال مدیا داخلی (بله/روبیکا/سروش)',  tier:'C', unit:'—', min:null, max:null, note:'متغیر / نیازمند استعلام', baseBudget:800000000, volType:'none', stage:'awareness' },
  { id:'billboard',name:'بیلبورد دیجیتال (Conversion بالا/گران)', tier:'C', unit:'CPV', min:140, max:140, note:'~۱۴۰ تومان/نمایش', baseBudget:400000000, volType:'view', stage:'awareness' },
  { id:'video',    name:'تبلیغات ویدیویی (تکمیلی Awareness)',   tier:'C', unit:'CPV', min:50, max:70, note:'۵۰ تا ۷۰ تومان/نمایش', baseBudget:800000000, volType:'view', stage:'awareness' },
];

const PACKAGES = {
  economic: { label:'اقتصادی (Economic)', desc:'هسته Performance — Search، Native، Retargeting، محصول + مکمل Display', defaultOn:['search','native','retarget','product','display'] },
  premium:  { label:'پریمیوم (Premium)',  desc:'هسته Performance + Retention کامل + پوشش Awareness مکمل', defaultOn:['search','native','retarget','product','display','push','sms','socialext','socialint','billboard','video'] },
};

let currentPkg = 'economic';
const checkedState = {};
const pctState = {};
MEDIA.forEach(m => { checkedState[m.id] = PACKAGES.economic.defaultOn.includes(m.id); pctState[m.id] = 100; });

function fmtToman(n){
  return Math.round(n).toLocaleString('fa-IR') + ' تومان';
}
function fmtNum(n){
  return Math.round(n).toLocaleString('fa-IR');
}

function renderMediaPicker(){
  const wrap = document.getElementById('mediaPicker');
  wrap.innerHTML = '';
  MEDIA.forEach(m => {
    const row = document.createElement('div');
    row.className = 'media-row';
    row.innerHTML = `
      <input type="checkbox" id="chk_${m.id}" ${checkedState[m.id] ? 'checked' : ''}>
      <div class="m-name">${m.name}${m.condition ? `<div style="font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;">${m.condition}</div>` : ''}
        <div class="m-slider-row">
          <span style="font-size:10.5px;color:var(--muted);">۵۰٪-</span>
          <input type="range" id="pct_${m.id}" min="50" max="150" value="${pctState[m.id]}" style="accent-color:var(--cinere-gold); width:120px;">
          <span style="font-size:10.5px;color:var(--muted);">۵۰٪+</span>
          <span id="pctlbl_${m.id}" style="font-size:11px;font-weight:700;color:var(--cinere-navy);min-width:34px;display:inline-block;">۱۰۰٪</span>
        </div>
      </div>
      <span class="m-tag ${m.tier}">${m.tier === 'A' ? 'اولویت A' : m.tier === 'B' ? 'اولویت B' : 'تکمیلی'}</span>
      <div class="m-price">${m.unit !== '—' ? m.unit + ': ' + m.note : m.note}<br><span style="opacity:.75;">پایه اکشن‌پلن: ${fmtToman(m.baseBudget)}</span></div>
      <div class="m-alloc" id="alloc_${m.id}">—</div>
      <div class="m-vol" id="vol_${m.id}">—</div>
    `;
    wrap.appendChild(row);
    row.querySelector('input[type=checkbox]').addEventListener('change', e => {
      checkedState[m.id] = e.target.checked;
      recompute();
    });
    row.querySelector('input[type=range]').addEventListener('input', e => {
      pctState[m.id] = Number(e.target.value);
      document.getElementById('pctlbl_' + m.id).textContent = pctState[m.id].toLocaleString('fa-IR') + '٪';
      recompute();
    });
  });
}

function selectPackage(pkgKey){
  currentPkg = pkgKey;
  MEDIA.forEach(m => checkedState[m.id] = PACKAGES[pkgKey].defaultOn.includes(m.id));
  document.querySelectorAll('.pkg-btn').forEach(b => b.classList.toggle('active', b.dataset.pkg === pkgKey));
  renderMediaPicker();
  recompute();
}

function recompute(){
  let grandTotal = 0;

  MEDIA.forEach(m => {
    const allocEl = document.getElementById('alloc_' + m.id);
    const volEl = document.getElementById('vol_' + m.id);
    if (!checkedState[m.id]) {
      allocEl.textContent = 'خارج از انتخاب';
      allocEl.style.color = '#b5bac1';
      volEl.textContent = '—';
      return;
    }
    allocEl.style.color = 'var(--cinere-navy)';
    const alloc = m.baseBudget * (pctState[m.id] / 100);
    grandTotal += alloc;
    allocEl.textContent = fmtToman(alloc);

    if (m.volType === 'none' || m.min == null) {
      volEl.textContent = 'ظرفیت: نیازمند استعلام';
    } else if (m.volType === 'click') {
      const lo = alloc / m.max, hi = alloc / m.min;
      volEl.textContent = '~' + fmtNum(lo) + ' تا ' + fmtNum(hi) + ' کلیک';
    } else if (m.volType === 'view') {
      const lo = alloc / m.max, hi = alloc / m.min;
      volEl.textContent = '~' + fmtNum(lo) + ' تا ' + fmtNum(hi) + ' نمایش';
    } else if (m.volType === 'reach') {
      const val = alloc / m.min;
      volEl.textContent = '~' + fmtNum(val) + ' نفر';
    }
  });

  document.getElementById('totalBudgetVal').textContent = fmtToman(grandTotal);
}

/* ============================================================
   JPEG EXPORT — draws the current selection (medium, allocated
   budget, total, Performance/Awareness split) onto a canvas and
   downloads it as a .jpg. Pure canvas, no external libraries.
   ============================================================ */
async function exportTariffImage(){
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }

  const checked = MEDIA.filter(m => checkedState[m.id]);
  if (checked.length === 0){
    alert('حداقل یک رسانه را از لیست بالا انتخاب کنید تا خروجی JPEG ساخته شود.');
    return;
  }

  const width = 1000;
  const rowH = 46;
  const headerH = 100;      // navy title band
  const tableHeadH = 78;    // column labels + divider before first row
  const footerH = 230;      // total line + ratio title + bar + legend + disclaimer + margin
  const height = headerH + tableHeadH + checked.length * rowH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = '#0d244c';
  ctx.fillRect(0, 0, width, headerH);
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 24px Vazirmatn, Tahoma, sans-serif';

/* ============================================================
   BOOTSTRAP
   ============================================================ */
function buildNav(){
  const nav = document.getElementById('toc');
  PAGES.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.dataset.id = p.id;
    btn.innerHTML = `<span class="num">${(i+1).toLocaleString('fa-IR')}</span>${p.title}`;
    btn.addEventListener('click', () => showPage(p.id));
    nav.appendChild(btn);
  });
}
function buildPages(){
  const main = document.getElementById('main');
  PAGES.forEach(p => {
    const sec = document.createElement('section');
    sec.className = 'page';
    sec.id = 'page-' + p.id;
    sec.innerHTML = p.html;
    main.appendChild(sec);
  });
}
function showPage(id){
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('active', el.id === 'page-' + id));
  document.querySelectorAll('#toc button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  window.scrollTo({top:0, behavior:'smooth'});
  if (id === 'tariff') { renderMediaPicker(); recompute(); }
}

buildNav();
buildPages();
showPage(PAGES[0].id);
document.querySelector('.pkg-btn[data-pkg="economic"]').classList.add('active');
</script>
